<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stanice Komorebi</title>
<meta name="description" content="Relaxační izometrická hra: rozvíjej malou japonskou železniční stanici v rušný uzel.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f8a78'/%3E%3Crect x='7' y='6' width='18' height='17' rx='3' fill='%23fbfcfa'/%3E%3Crect x='10' y='9' width='12' height='6' fill='%231c2a3f'/%3E%3Ccircle cx='11' cy='19' r='1.6' fill='%23cf4a33'/%3E%3Ccircle cx='21' cy='19' r='1.6' fill='%23cf4a33'/%3E%3Cpath d='M10 23l-3 4M22 23l3 4' stroke='%23fbfcfa' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: celoobrazovková izometrická dioráma; ovládání vypadá jako japonské nádražní cedule (ekimeihyó) a papírové jízdenky. */
:root{
  --ink:#1c2a3f; --ink-soft:#5b6a7c; --sign:#fbfcfa; --line:#1f8a78; --line-deep:#146556;
  --ticket:#eef3ef; --ticket-edge:#cfdad3; --gold:#c9902a; --vermilion:#cf4a33; --sky:#cfe3e6;
  --disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;position:relative;overscroll-behavior:none}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--vermilion);outline-offset:2px}

/* Cedule se jménem stanice */
#sign{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(340px,calc(100% - 32px));background:var(--sign);border-radius:4px;box-shadow:0 1px 0 #fff inset,0 6px 22px rgba(28,42,63,.2);overflow:hidden}
#sign .top{padding:9px 14px 5px;display:flex;align-items:baseline;gap:10px}
#sign .kanji{font-family:var(--disp);font-weight:800;font-size:1.75rem;letter-spacing:.14em;line-height:1.1;white-space:nowrap}
#sign .roma{font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
#sign .band{height:15px;background:var(--line);position:relative}
#sign .band::after{content:"";position:absolute;left:50%;top:-2px;width:19px;height:19px;margin-left:-9.5px;border-radius:50%;background:var(--sign);border:4px solid var(--line-deep);box-sizing:border-box}
#sign .near{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-soft);padding:3px 14px 0}
#sign .money{padding:5px 14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
#money{font-weight:700;font-size:1.55rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#rate{font-size:.8rem;color:var(--line-deep);font-variant-numeric:tabular-nums;font-weight:500}
#rank{font-size:.72rem;color:var(--ink-soft);padding:0 14px 9px;margin-top:-6px}

/* Stavový proužek */
#status{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
.chip{background:rgba(28,42,63,.84);color:#f3f6f4;border:0;border-radius:3px;padding:6px 10px;font-size:.76rem;font-variant-numeric:tabular-nums;line-height:1.2}
.eventChip{background:var(--vermilion);font-weight:700}
button.chip{cursor:pointer}
button.chip:hover{background:var(--ink)}

/* Panel investic */
#panel{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:330px;background:var(--sign);border-radius:4px;box-shadow:0 6px 22px rgba(28,42,63,.22);display:flex;flex-direction:column;min-height:0;transition:transform .28s ease}
#panel.closed{transform:translateX(calc(100% + 24px))}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 8px 14px;gap:8px}
#panelHead h2{font-family:var(--disp);font-weight:800;font-size:1.15rem;margin:0}
#closePanel{background:none;border:0;cursor:pointer;font-size:.8rem;color:var(--ink-soft);padding:4px 6px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:3px solid var(--line)}
#tabs button{background:none;border:0;padding:8px 2px;font-size:.86rem;font-weight:500;cursor:pointer;color:var(--ink-soft);position:relative}
#tabs button[aria-selected="true"]{background:var(--line);color:#fff;font-weight:700}
#tabs .dot{display:inline-block;min-width:1.25em;margin-left:4px;font-size:.68rem;line-height:1.25em;background:var(--gold);color:#fff;border-radius:9px;font-variant-numeric:tabular-nums}
#tabs .dot:empty{display:none}
#hint{font-size:.8rem;line-height:1.4;padding:8px 14px;color:var(--ink);background:#e3f0ec}
#list{flex:1;min-height:0;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.tk{background:var(--ticket);border:1px solid var(--ticket-edge);border-radius:3px;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center}
.tk.maxed{opacity:.72}
.tk h3{margin:0;font-size:.92rem;font-weight:700;line-height:1.25;min-width:0}
.tk h3 span{font-family:var(--disp);font-weight:600;color:var(--ink-soft);font-size:.74rem;margin-left:5px}
.tk p{margin:0;font-size:.76rem;line-height:1.35;color:var(--ink-soft);grid-column:1;min-width:0}
.tk .pips{grid-column:1;display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.tk .pips i{width:9px;height:5px;background:var(--ticket-edge);display:block}
.tk .pips i.on{background:var(--line)}
.tk button{grid-column:2;grid-row:1 / span 3;min-width:86px;border:0;border-radius:3px;background:var(--line);color:#fff;font-weight:700;font-size:.82rem;padding:9px 8px;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.tk button:hover:not(:disabled){background:var(--line-deep)}
.tk button:disabled{background:#d7e0db;color:#65727a;cursor:default}
#panelFoot{padding:8px 14px;font-size:.74rem;color:var(--ink-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--ticket-edge);flex-wrap:wrap}
#panelFoot button{background:none;border:0;padding:2px 0;font-size:.74rem;color:var(--ink-soft);text-decoration:underline;cursor:pointer}
#panelFoot button.danger{color:#fff;background:var(--vermilion);font-weight:700;text-decoration:none;padding:5px 9px;border-radius:3px}
#panelFoot button.resetMain{color:var(--vermilion);border:1px solid var(--vermilion);text-decoration:none;font-weight:700;padding:4px 9px;border-radius:3px}
#panelFoot .resetAsk{color:var(--ink);font-weight:500}
#resetWrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#openPanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--line);color:#fff;border:0;border-radius:3px;padding:11px 16px;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 4px 14px rgba(28,42,63,.3)}
#openPanel b{color:#ffe2a0;margin-left:4px}

#toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:3px;font-size:.84rem;max-width:min(420px,calc(100% - 32px));line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center;pointer-events:none;transition:opacity .4s;opacity:0;z-index:5}
#toast.on{opacity:1}

@media (max-width:760px){
  #sign .kanji{font-size:1.25rem}
  #sign .top{padding:6px 12px 3px}
  #sign .near{display:none}
  #sign .band{height:9px}
  #sign .band::after{display:none}
  #sign .money{padding:4px 12px 6px}
  #money{font-size:1.25rem}
  #rank{display:none}
  #panel{left:0;right:0;width:auto;top:auto;bottom:0;height:47%;border-radius:8px 8px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #panel.closed{transform:translateY(calc(100% + 10px))}
  #status{bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 170px)}
  #panel:not(.closed) ~ #status{display:none}
  #toast{top:auto;bottom:calc(52% + 8px)}
}
@media (prefers-reduced-motion:reduce){#panel,#toast{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Izometrický pohled na japonskou železniční stanici a její okolí"></canvas>

<section id="sign" aria-label="Stanice a pokladna">
  <div class="top"><span class="kanji">木漏れ日</span><span class="roma">Komorebi</span></div>
  <div class="band"></div>
  <div class="near"><span>← Sakaue</span><span>Minato →</span></div>
  <div class="money"><span id="money">¥ 0</span><span id="rate"></span></div>
  <div id="rank"></div>
</section>

<aside id="panel" aria-label="Investice">
  <div id="panelHead"><h2>Investice</h2><button id="closePanel" type="button">Skrýt a jen se dívat</button></div>
  <div id="tabs" role="tablist"></div>
  <div id="hint"></div>
  <div id="list"></div>
  <div id="panelFoot"><span id="totals"></span><span id="resetWrap"><button id="resetBtn" class="resetMain" type="button">Reset hry</button></span></div>
</aside>
<div id="status">
  <span class="chip" id="clock"></span>
  <span class="chip" id="waitChip"></span>
  <span class="chip eventChip" id="eventChip" hidden></span>
  <button class="chip" id="soundBtn" type="button">Zapnout zvuk</button>
  <button class="chip" id="zoomIn" type="button" aria-label="Přiblížit">+</button>
  <button class="chip" id="zoomOut" type="button" aria-label="Oddálit">−</button>
</div>
<button id="openPanel" type="button" hidden>Investice<b id="openCount"></b></button>
<div id="toast" role="status"></div>

<script>
(()=>{"use strict";
/* ─────────────── EKONOMIKA ─────────────── */
const UPG = [
 // KOLEJE
 {id:"cars",tab:0,jp:"編成",name:"Delší soupravy",desc:"Každý vlak má o vůz víc a odveze víc lidí.",max:5,cost:900,g:7.5,at:[17,13]},
 {id:"sched",tab:0,jp:"ダイヤ",name:"Hustší jízdní řád",desc:"Vlaky jezdí o 12 % častěji.",max:7,cost:2600,g:3.1,at:[17,13]},
 {id:"tracks",tab:0,jp:"線路",name:"Nová kolej",desc:"Další kolej, další vlaky. První přinese ostrovní nástupiště a lávku.",max:3,cost:42000,g:16,at:[17,16]},
 {id:"elec",tab:0,jp:"電化",name:"Elektrifikace trati",desc:"Trolej a nové stříbrné vlaky: o 15 % rychlejší provoz, o 25 % větší kapacita.",max:1,cost:300000,g:1,at:[20,13]},
 {id:"express",tab:0,jp:"特急",name:"Rychlík do Tokia",desc:"Na čtvrté koleji staví vysokorychlostní vlak ve stylu šinkansenu a jízdné roste o 60 %.",max:1,cost:9e7,g:1,at:[17,19],req:s=>s.tracks>=3&&s.elec>=1,reqText:"Vyžaduje čtvrtou kolej a elektrifikaci."},
 // STANICE
 {id:"decor",tab:1,jp:"花壇",name:"Lavičky a květiny",desc:"Hezčí čekání. Přijde o 8 % víc lidí.",max:3,cost:400,g:6,at:[22,8]},
 {id:"machine",tab:1,jp:"券売機",name:"Automaty na jízdenky",desc:"Rychlejší odbavení, jízdné o 25 % vyšší.",max:3,cost:1500,g:9,at:[19.5,7.5]},
 {id:"vending",tab:1,jp:"自販機",name:"Nápojové automaty",desc:"Každý cestující si koupí pití: +¥20 za osobu.",max:4,cost:3200,g:6,at:[12,11.5]},
 {id:"canopy",tab:1,jp:"屋根",name:"Přístřešek na peronu",desc:"Sucho i za deště. Přijde o 12 % víc lidí.",max:3,cost:9000,g:7,at:[17,11.8]},
 {id:"kiosk",tab:1,jp:"売店",name:"Kiosek s bentem",desc:"Obědové krabičky na cestu: +¥60 za osobu.",max:2,cost:30000,g:12,at:[22,11.7]},
 {id:"building",tab:1,jp:"駅舎",name:"Přestavba budovy",desc:"Větší nádražní budova: o 20 % víc lidí a o 20 % vyšší jízdné.",max:3,cost:180000,g:8,at:[15,9]},
 // OKOLÍ
 {id:"houses",tab:2,jp:"住宅",name:"Nové domy",desc:"Noví sousedé jezdí vlakem. Každý dům přivede další cestující.",max:10,cost:700,g:2.3,at:[6,7]},
 {id:"homes",tab:2,jp:"改築",name:"Vylepšení domů",desc:"Všechny obytné domy zkrásní a přibudou na nich detaily: zahrádka, druhé patro, balkon, solární panely. O 8 % víc lidí za stupeň.",max:4,cost:9000,g:6,at:[5,4]},
 {id:"walk",tab:2,jp:"歩道",name:"Chodníky",desc:"Bezpečná cesta na nádraží: o 6 % víc lidí. První stupeň lemuje ulici, druhý silnici k přejezdu.",max:2,cost:2200,g:9,at:[30,5.9]},
 {id:"trees",tab:2,jp:"桜",name:"Sakury podél trati",desc:"Výletníci za květy: o 5 % víc lidí za každou řadu.",max:6,cost:5000,g:3.4,at:[12,22.5]},
 {id:"bike",tab:2,jp:"駐輪場",name:"Parkoviště kol",desc:"Lidé z dalekého okolí dojedou na kole.",max:1,cost:6000,g:1,at:[30,10]},
 {id:"bus",tab:2,jp:"バス停",name:"Autobusová zastávka",desc:"Autobus pravidelně sváží lidi z údolí: o 30 % víc cestujících a jízdné z každého příjezdu.",max:1,cost:50000,g:1,at:[24,5.2]},
 {id:"shops",tab:2,jp:"商店街",name:"Nákupní ulička",desc:"Nový obchod: víc lidí a +¥25 za osobu.",max:5,cost:12000,g:3.6,at:[26,3]},
 {id:"cafe",tab:2,jp:"猫カフェ",name:"Kočičí kavárna",desc:"Speciální budova. Výletníci za kočkami: o 10 % víc lidí a +¥30 za osobu. Kočka štěstí chodí dvakrát častěji a nosí větší bonus.",max:1,cost:180000,g:1,at:[19.3,2.2]},
 {id:"shopup",tab:2,jp:"改装",name:"Vylepšení uličky",desc:"Všechny obchody zkrásní a přibudou na nich detaily: stánky s praporky, patro s vývěsními štíty, krytá pasáž s lucernami, neony. +¥15 za osobu za stupeň.",max:4,cost:30000,g:6,at:[26,3.6]},
 {id:"shrine",tab:2,jp:"神社",name:"Chrám s branou torii",desc:"Poutníci a turisté: první stupeň přidá 25 % cestujících, každý další 10 %. Každý stupeň chrám zkrášlí.",max:4,cost:700000,g:4,at:[38,9]},
 {id:"onsen",tab:2,jp:"温泉",name:"Lázně onsen",desc:"Hosté z měst: o 15 % víc lidí a o 15 % vyšší jízdné.",max:3,cost:2.4e6,g:5,at:[6,25]},
];
const UPGMAP = Object.fromEntries(UPG.map(u=>[u.id,u]));
const TABS = ["Koleje","Stanice","Okolí"];
const blankL = ()=>Object.fromEntries(UPG.map(u=>[u.id,0]));
const costOf = (u,l)=>{const c=u.cost*Math.pow(u.g,l);const m=Math.pow(10,Math.floor(Math.log10(c))-1);return Math.round(c/m)*m};
function rates(L){
  const demand=(0.32+0.1*L.houses+0.28*L.shops+(L.bike?0.3:0))
    *(1+.08*L.decor)*(1+.06*L.walk)*(1+.08*L.homes)*(L.cafe?1.1:1)*(1+.12*L.canopy)*(1+.05*L.trees)*(1+.2*L.building)
    *(L.bus?1.3:1)*(L.shrine?1.15+.1*L.shrine:1)*(1+.15*L.onsen);
  const interval=Math.max(26,75*Math.pow(.88,L.sched)*(L.elec?.85:1));
  const tracks=1+L.tracks, cars=1+L.cars;
  const cap=Math.round(cars*50*(L.elec?1.25:1));
  const capRate=tracks*cap/interval;
  const fare=Math.round(150*(1+.25*L.machine)*(1+.2*L.building)*(1+.15*L.onsen)*(L.express?1.6:1)/10)*10;
  const spend=20*L.vending+60*L.kiosk+25*L.shops+(L.cafe?30:0)+15*L.shopup*(L.shops?1:0);
  const flow=Math.min(demand,capRate);
  return {demand,interval,tracks,cars,cap,capRate,fare,spend,flow,perMin:flow*(fare+spend)*60};
}

/* ─────────────── STAV ─────────────── */
const SAVE_KEY="komorebi-save-v1";
let G={L:blankL(),money:600,total:0,pax:0,clock:.3,savedAt:Date.now(),waiting:5};
function applySave(s){
  if(!s||!s.L)return false;
  G={...G,...s,L:{...blankL(),...s.L}};
  return true;
}
function serialize(){return {L:G.L,money:G.money,total:G.total,pax:G.pax,clock:G.clock,savedAt:Date.now(),waiting:G.waiting}}
function readLocal(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||"null")}catch(e){return null}}
function writeLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(serialize()))}catch(e){}}
function saveCloud(){writeLocal()}

/* ─────────────── FORMÁTY ─────────────── */
const nf=new Intl.NumberFormat("cs-CZ");
function yen(v){
  v=Math.floor(v);
  if(v>=1e9)return "¥ "+(v/1e9).toLocaleString("cs-CZ",{maximumFractionDigits:2})+" mld.";
  if(v>=1e7)return "¥ "+(v/1e6).toLocaleString("cs-CZ",{maximumFractionDigits:1})+" mil.";
  return "¥ "+nf.format(v);
}
const $=id=>document.getElementById(id);
let toastTimer;
function toast(t,ms=2800){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("on"),ms)}

/* ─────────────── ROČNÍ OBDOBÍ A BARVY ─────────────── */
function hex(c){return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
const mixCache=new Map();
function mix(a,b,t){
  t=Math.round(t*32)/32;
  const k=a+b+t;let r=mixCache.get(k);
  if(r)return r;
  const A=hex(a),B=hex(b);
  r="#"+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,"0")).join("");
  if(mixCache.size>6000)mixCache.clear();
  mixCache.set(k,r);return r;
}
const dark=(c,t)=>mix(c,"#141a2c",t);
const SEASONS=[
 {name:"Jaro",grass:"#9cbf73",grass2:"#b1cc80",tree:"#5f9a58",tree2:"#7bb268",sakura:"#f4bcc9",sakura2:"#fbd8de",paddy:"#8fb9c0",paddy2:"#a7c98d",soil:"#a98f6c",snow:0},
 {name:"Léto",grass:"#6fa65a",grass2:"#83b566",tree:"#3f8246",tree2:"#58994f",sakura:"#4f9150",sakura2:"#69a55c",paddy:"#6aa752",paddy2:"#88bf5f",soil:"#9b8460",snow:0},
 {name:"Podzim",grass:"#b1a860",grass2:"#c2b56c",tree:"#c9772f",tree2:"#dd9a3e",sakura:"#c9503a",sakura2:"#e17a3f",paddy:"#d3ae4c",paddy2:"#e0c060",soil:"#a2835a",snow:0},
 {name:"Zima",grass:"#e6ebee",grass2:"#f4f6f7",tree:"#6f8a7c",tree2:"#a9bdb3",sakura:"#8c7a70",sakura2:"#c9c4c0",paddy:"#d9e3e7",paddy2:"#ecf1f2",soil:"#b8b4ad",snow:1},
];
const DAY_LEN=150, SEASON_DAYS=3;
const EVENT_BOOST=1.3;
const EVENTS=[
 {name:"Hanami",jp:"花見",text:"pikniky pod kvetoucími sakurami. Přijíždí o 30 % víc lidí."},
 {name:"Letní matsuri",jp:"祭り",text:"stánky na náměstí a v noci ohňostroj. Přijíždí o 30 % víc lidí."},
 {name:"Momiji",jp:"紅葉",text:"turisté míří za barevným listím. Přijíždí o 30 % víc lidí."},
 {name:"Zimní slavnost luceren",jp:"雪灯り",text:"sněhové lucerny a hustý sníh. Přijíždí o 30 % víc lidí."},
];
let eventNow=-1,uiReady=false;
let pal={},season=0,seasonName="Jaro",snow=0,night=0,hour=8;
function updatePalette(){
  const yearLen=SEASON_DAYS*4;
  const d=(G.clock%yearLen);
  const si=Math.floor(d/SEASON_DAYS), f=(d/SEASON_DAYS)-si;
  season=si;seasonName=SEASONS[si].name;
  const ev=Math.floor(d%SEASON_DAYS)===1?si:-1;
  if(ev!==eventNow){eventNow=ev;if(ev>=0){toast(EVENTS[ev].name+": "+EVENTS[ev].text,6000);if(uiReady)blip()}}
  const blend=Math.round(Math.max(0,(f-.8)/.2)*10)/10;
  const a=SEASONS[si],b=SEASONS[(si+1)%4];
  const p={};for(const k in a)if(typeof a[k]==="string"&&k!=="name")p[k]=mix(a[k],b[k],blend);
  snow=a.snow+(b.snow-a.snow)*blend;
  const key=si+":"+blend;
  if(key!==pal.key)groundDirty=true;
  if(ev===2){p.tree=mix(p.tree,"#c8402c",.55);p.tree2=mix(p.tree2,"#e8703a",.5);p.sakura=mix(p.sakura,"#c8302c",.5)}
  p.key=key;pal=p;
  const dayF=G.clock%1; hour=(dayF*24+0)%24;
  // noc 19–5, plynulé přechody
  const h=hour;
  night=h<4.5||h>20?1:h<6.5?(6.5-h)/2:h>18?(h-18)/2:0;
}
const roofC=c=>mix(c,"#f2f5f7",snow*.82);

/* ─────────────── KRESBA: ZÁKLAD ─────────────── */
const HW=24,HH=12,ZU=24,MAPX=40,MAPY=28;
const cv=$("scene"),ctx=cv.getContext("2d");
let c=ctx;
const px=(x,y,z=0)=>(x-y)*HW, py=(x,y,z=0)=>(x+y)*HH-z*ZU;
function poly(pts,fill){c.beginPath();for(let i=0;i<pts.length;i+=3){const X=px(pts[i],pts[i+1]),Y=py(pts[i],pts[i+1],pts[i+2]);i?c.lineTo(X,Y):c.moveTo(X,Y)}c.closePath();c.fillStyle=fill;c.fill()}
function top(x,y,z,dx,dy,f){poly([x,y,z,x+dx,y,z,x+dx,y+dy,z,x,y+dy,z],f)}
function wallY(x0,x1,y,z0,z1,f){poly([x0,y,z0,x1,y,z0,x1,y,z1,x0,y,z1],f)}
function wallX(x,y0,y1,z0,z1,f){poly([x,y0,z0,x,y1,z0,x,y1,z1,x,y0,z1],f)}
function box(x,y,z,dx,dy,dz,f,side){
  top(x,y,z+dz,dx,dy,f);
  const s=side||f;
  wallY(x,x+dx,y+dy,z,z+dz,dark(s,.12));
  wallX(x+dx,y,y+dy,z,z+dz,dark(s,.28));
}
/* Sedlová střecha. along:"x" = hřeben podél osy x */
function roof(x,y,z,dx,dy,h,col,opt={}){
  const ov=opt.ov??.28, wall=opt.wall||"#e8e0d0", rc=roofC(col);
  const x0=x-ov,x1=x+dx+ov,y0=y-ov,y1=y+dy+ov;
  if((opt.along||"x")==="x"){
    const r=y+dy/2;
    poly([x0,y0,z,x1,y0,z,x1,r,z+h,x0,r,z+h],dark(rc,.05));
    poly([x+dx,y,z,x+dx,r,z+h,x+dx,y+dy,z],dark(wall,.26));
    poly([x0,r,z+h,x1,r,z+h,x1,y1,z,x0,y1,z],dark(rc,.14));
    c.strokeStyle=dark(rc,.3);c.lineWidth=.6;c.beginPath();
    for(let i=1;i<4;i++){const t=i/4,Y=r+(y1-r)*t,Z=z+h*(1-t);c.moveTo(px(x0,Y),py(x0,Y,Z));c.lineTo(px(x1,Y),py(x1,Y,Z))}c.stroke();
    poly([x1,y0,z,x1,r,z+h,x1+.0,r,z+h-.13,x1,y0,z-.13],dark(rc,.38));
    poly([x1,r,z+h,x1,y1,z,x1,y1,z-.13,x1,r,z+h-.13],dark(rc,.38));
  }else{
    const r=x+dx/2;
    poly([x0,y0,z,x0,y1,z,r,y1,z+h,r,y0,z+h],dark(rc,.05));
    poly([x,y+dy,z,x+dx,y+dy,z,r,y+dy,z+h],dark(wall,.13));
    poly([r,y0,z+h,x1,y0,z,x1,y1,z,r,y1,z+h],dark(rc,.28));
    c.strokeStyle=dark(rc,.42);c.lineWidth=.6;c.beginPath();
    for(let i=1;i<4;i++){const t=i/4,X=r+(x1-r)*t,Z=z+h*(1-t);c.moveTo(px(X,y0),py(X,y0,Z));c.lineTo(px(X,y1),py(X,y1,Z))}c.stroke();
    poly([x0,y1,z,r,y1,z+h,r,y1,z+h-.13,x0,y1,z-.13],dark(rc,.3));
    poly([r,y1,z+h,x1,y1,z,x1,y1,z-.13,r,y1,z+h-.13],dark(rc,.3));
  }
}
function textY(t,x,y,z,size,col,font){c.save();c.transform(1,.5,0,1,px(x,y),py(x,y,z));c.font=(font||"800 ")+size+"px "+'"Shippori Mincho","Noto Serif CJK JP",serif';c.fillStyle=col;c.textAlign="center";c.textBaseline="middle";c.fillText(t,0,0);c.restore()}
function textX(t,x,y,z,size,col){c.save();c.transform(1,-.5,0,1,px(x,y),py(x,y,z));c.font="800 "+size+"px "+'"Shippori Mincho","Noto Serif CJK JP",serif';c.fillStyle=col;c.textAlign="center";c.textBaseline="middle";c.fillText(t,0,0);c.restore()}
function winY(x0,x1,y,z0,z1){const w=mix("#7fa0b8","#ffe08a",night);wallY(x0,x1,y,z0,z1,w);if(night>.3)addLight((x0+x1)/2,y,(z0+z1)/2,.32,.5)}
function winX(x,y0,y1,z0,z1){const w=mix("#5f7f96","#ffd477",night);wallX(x,y0,y1,z0,z1,w);if(night>.3)addLight(x,(y0+y1)/2,(z0+z1)/2,.32,.5)}

let groundDirty=true;
const groundCanvas=document.createElement("canvas");
const GPAD=30,GMINX=-MAPY*HW-GPAD,GMINY=-GPAD,GW=(MAPX+MAPY)*HW+GPAD*2,GH=(MAPX+MAPY)*HH+GPAD*2+60,GS=1.6;
function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return s/2147483647}}
const TRACKY=[13.25,14.75,17.75,19.25];
function buildGround(){
  groundCanvas.width=GW*GS;groundCanvas.height=GH*GS;
  const g=groundCanvas.getContext("2d");
  g.setTransform(GS,0,0,GS,-GMINX*GS,-GMINY*GS);
  const old=c;c=g;

  for(let y=1;y<MAPY;y+=2.2){if(y>1.8&&y<7||y>12&&y<21)continue;top(33.97,y,0,.06,1.1,lineC)}

  for(const y of [5.97,3.11])for(let x=33.08;x<34.9;x+=.34)top(x,y,.005,.18,.72,lineC); // přes silnici

  top(34,5.87,.005,1,.05,lineC);top(33,6.78,.005,1,.05,lineC);

  top(35.95,4.87,.005,.05,.93,lineC);

  if(G.L.walk>=1){
    const sw=mix("#cfcbc0","#eceeee",snow*.7);

    seg(0,3.55,33,.45);seg(35,3.55,5,.45);

      for(const [y,dy] of [[0,3.55],[6.25,5.85],[21.4,6.6]]){seg(32.5,y,.5,dy);seg(35,y,.5,dy)}

  if(G.L.shrine>=2){

    const pv=mix("#9b978c","#c9cbca",snow*.5);
    for(let y=9.75;y<12.1;y+=.32)top(37.4,y,.002,1,.26,pv);
  }

  for(let i=0;i<4;i++)for(let j=0;j<2;j++){
    const x=10.5+i*5.6,y=23.2+j*2.35;
    if(x+5>33)continue;
    top(x-.1,y-.1,0,5.2,2.3,pal.soil);

    g.strokeStyle=pal.paddy2;g.lineWidth=1.2;g.beginPath();
    for(let k=.3;k<5;k+=.42){g.moveTo(px(x+k,y+.08),py(x+k,y+.08));g.lineTo(px(x+k,y+2.02),py(x+k,y+2.02))}g.stroke();
  }

  const n=1+G.L.tracks;
  const bal=mix("#8d8678","#c9cac8",snow*.65);

  top(33,12.3,.03,2,.12,"#f0c93a");top(33,lastY,.03,2,.12,"#f0c93a");

const LAUNDRY=["#f4f4ee","#7fa8c9","#e8778f","#e6c04c","#9cc29a"];

let fw=[],fwIn=1;
const FW_COL=["#ff6a5c","#ffd86a","#7fd4ff","#ff9ad1","#a5f07f","#ffffff"];
function updateFireworks(dt){
  if(eventNow===1&&(night>.25)){
    fwIn-=dt;
    if(fwIn<=0&&fw.length<9){
      fwIn=reduced?7:.55+Math.random()*1.3;
      const x=-620+Math.random()*1240,top_=Math.abs(x)*.42-95-Math.random()*65;
      fw.push({x,y:top_+250,ty:top_,t:0,boom:false,col:FW_COL[Math.floor(Math.random()*FW_COL.length)],col2:FW_COL[Math.floor(Math.random()*FW_COL.length)],sp:[]});
    }
  }
  for(const f of fw){
    f.t+=dt;
    if(!f.boom){
      f.y+=(f.ty-f.y)*Math.min(1,dt*3.2);
      if(Math.abs(f.y-f.ty)<14){
        f.boom=true;f.t=0;note(70,0,.9,.07);note(120,.03,.5,.03);
        const n=reduced?24:64,R=62+Math.random()*62;
        for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.1,r=R*(.55+Math.random()*.45);f.sp.push({a,r,c:i%3?f.col:f.col2})}
      }
    }
  }
  fw=fw.filter(f=>!f.boom||f.t<2.1);
}
function drawFireworks(){
  if(!fw.length)return;
  c.globalCompositeOperation="lighter";
  for(const f of fw){
    if(!f.boom){c.globalAlpha=.9;c.fillStyle="#ffe7a8";c.beginPath();c.arc(f.x,f.y,1.8,0,6.3);c.arc(f.x,f.y+7,1,0,6.3);c.fill();continue}
    const p=Math.min(1,f.t/.75),e=1-Math.pow(1-p,3),fade=Math.max(0,1-f.t/2.1);
    for(const s2 of f.sp){
      const X=f.x+Math.cos(s2.a)*s2.r*e,Y=f.y+Math.sin(s2.a)*s2.r*e+f.t*f.t*14;
      c.globalAlpha=fade;c.fillStyle=s2.c;c.beginPath();c.arc(X,Y,2.4*(.45+fade*.75),0,6.3);c.fill();
    }
  }
  c.globalAlpha=1;c.globalCompositeOperation="source-over";
}

function updateBus(dt){
  if(!G.L.bus)return;
  if(bus.phase==="off"){
    bus.idle-=dt;
    if(bus.idle<=0){
      bus.phase="come";bus.x=40.5;bus.v=2.8;bus.t=0;bus.did=false;busCross=false;
      // lidé jdou z nádraží počkat na zastávku
      const m=2+Math.floor(Math.random()*3);
      for(let i=0;i<m&&people.length<MAXP;i++){
        const p=newPerson(19.15,9.5,0);p.plat="BUS";
        p.path=[{x:19.75,y:9.4,z:0},{x:19.85,y:8,z:0},{x:22.9+Math.random()*1.5,y:6.12+Math.random()*.18,z:0}];
        people.push(p);
      }
    }
    return;
  }
  let target=2.8;
  if(bus.phase==="come"){
    if(!busCross&&bus.x>BUS_LINE-.02&&bus.x<37&&busFree()&&!zebraBusy.E)busCross=true;
    if(!busCross&&bus.x>=BUS_LINE)target=Math.min(2.8,(bus.x-BUS_LINE)*2.2);
    if(busCross&&bus.x+BUS_LEN<32.9)busCross=false;
    if(zebraBusy.W&&bus.x>=32.97)target=Math.min(target,(bus.x-32.97)*2.2);
    if(bus.x<30)target=Math.min(target,(bus.x-BUS_STOP)*1.1+.25);
    if(bus.x<=BUS_STOP+.02){bus.phase="dwell";bus.t=0;bus.x=BUS_STOP;bus.v=0}
  }else if(bus.phase==="dwell"){
    bus.t+=dt;target=0;
    if(bus.t>.6&&!bus.did){
      bus.did=true;
      const r=rates(G.L),n=Math.round(4+r.demand*3),gain=n*Math.round(r.fare*.5);
      G.money+=gain;G.total+=gain;G.pax+=n;G.waiting+=n*.5;
      floats.push({x:BUS_STOP+1.8,y:5.8,z:2.4,txt:"Autobus +"+yen(gain),life:2.6,big:true});
      doorSound();
      const vis=Math.min(n,7);
      const opts=["A"];if(r.tracks>=2)opts.push("I");if(r.tracks>=4)opts.push("C");
      for(let i=0;i<vis&&people.length<MAXP;i++){
        const plat=opts[Math.floor(Math.random()*opts.length)],p=newPerson(BUS_STOP+(i%2?2.36:.55),5.88,0);
        p.delay=.2+i*.32;p.plat=plat;
        p.path=[{x:20.5+Math.random()*1.3,y:6.6+Math.random()*.6,z:0},{x:19.85,y:8,z:0},{x:19.75,y:9.4,z:0},{x:19.15,y:9.5,z:0,hide:3},{...DOOR},...pathToPlat(plat)];
        people.push(p);
      }
      people.filter(p=>p.plat==="BUS").forEach((p,i)=>{
        p.state="walk";p.board=true;p.delay=.9+i*.35;p.i=0;p.path=[{x:BUS_STOP+.55,y:5.88,z:0}];
      });
    }
    if(bus.t>7){bus.phase="leave";bus.t=0}
  }else{
    target=3;
    if(bus.x<-BUS_LEN-.5){bus.phase="off";bus.idle=24+Math.random()*16;bus.x=44;return}
  }
  // cyklistům před sebou dá přednost
  // (křížící cyklisté čekají oni; pojistka: autobus nikdy nečeká déle než pár sekund)
  if(riders.some(r=>r.dx<-.5&&r.x<bus.x&&r.x>bus.x-1.3&&r.y>4.55&&r.y<5.95)&&(bus.yieldT||0)<5){target=0;bus.yieldT=(bus.yieldT||0)+dt}
  else bus.yieldT=Math.max(0,(bus.yieldT||0)-dt*.5);
  bus.v+=(target-bus.v)*Math.min(1,dt*(target<bus.v?5:1.2));
  let nx=bus.x-bus.v*dt;
  if(bus.phase==="come"&&!busCross&&bus.x>=BUS_LINE)nx=Math.max(nx,BUS_LINE);
  if(bus.phase==="come")nx=Math.max(nx,BUS_STOP);
  if(bus.phase==="come"&&zebraBusy.W&&bus.x>=32.97)nx=Math.max(nx,32.97);
  bus.x=nx;
}

  for(const p of people){
    if(p.delay>0){p.delay-=dt;continue}
    if(p.hide>0){p.hide-=dt;continue}
    if(p.hidden){ // prošel budovou: objeví se u druhých dveří
      p.hidden=false;
      const n=p.path[p.i];
      if(n){p.x=n.x;p.y=n.y;p.z=n.z;p.i++}
    }
    if(p.state!=="walk")continue;
    const w=p.path[p.i];
    if(w&&w.cross&&!p.onZebra){if(!crossFree(w.cross))continue;p.onZebra=w.cross;zebraBusy[w.cross]=true}
    if(!w){ // cíl

    }
    const dx=w.x-p.x,dy=w.y-p.y,dz=w.z-p.z,d=Math.hypot(dx,dy);

  zebraBusyT=zebraBusy.S||zebraBusy.N?zebraBusyT+dt:0;
  if(zebraBusyT>4)zebraCool=7;

}

function panelRoom(){const p=$("panel");if(p.classList.contains("closed"))return {r:0,b:0};if(innerWidth<=760)return {r:0,b:p.offsetHeight};return {r:p.offsetWidth+24,b:0}}

/* ─────────────── ZVUK ─────────────── */
let AC=null,soundOn=false,ambAcc=4,gateSnd=0;
function note(f,t0,dur,vol,type="sine"){
  if(!AC||!soundOn)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  const n=AC.currentTime+t0;
  g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(vol,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+dur);
  o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+dur+.05);
}
const SCALE=[293.66,329.63,392,440,493.88,587.33,659.25,783.99];
function melody(){ // vlastní krátká odjezdová znělka
  [5,4,3,5,6,7,5].forEach((d,i)=>note(SCALE[d],i*.24,.9,.05,"triangle"));
}
function doorSound(){note(880,0,.25,.018);note(660,.18,.3,.018)}
function ambient(dt){
  if(!soundOn)return;
  ambAcc-=dt;
  if(ambAcc<=0){
    ambAcc=2.5+Math.random()*5;
    const n=1+Math.floor(Math.random()*3);
    let d=Math.floor(Math.random()*5);
    for(let i=0;i<n;i++){note(SCALE[d]/2,i*.42,2.4,.035,"triangle");d=(d+[1,2,-1,3][Math.floor(Math.random()*4)]+8)%8}
  }
}
function crossingBell(dt){
  if(!soundOn||!gateTarget)return;
  gateSnd-=dt;
  if(gateSnd<=0){gateSnd=.6;note(1180,0,.25,.008,"square")}
}

/* ─────────────── ROZHRANÍ ─────────────── */
let tab=0;
const RANKS=[[0,"Venkovská zastávka"],[8,"Malá stanice"],[20,"Městská stanice"],[34,"Rušný uzel"],[48,"Hlavní stanice údolí"],[1e9,""]];
const MAXSUM=UPG.reduce((a,u)=>a+u.max,0);
function buildTabs(){
  const el=$("tabs");el.innerHTML="";
  TABS.forEach((n,i)=>{
    const b=document.createElement("button");b.type="button";b.id="tab"+i;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",i===tab);
    b.innerHTML=n+'<span class="dot"></span>';
    b.onclick=()=>{tab=i;buildTabs();renderList()};
    el.appendChild(b);
  });
}
const rowsEl={};
function renderList(){
  const el=$("list");el.innerHTML="";
  for(const k in rowsEl)delete rowsEl[k];
  UPG.filter(u=>u.tab===tab).sort((a,b)=>{const am=G.L[a.id]>=a.max,bm=G.L[b.id]>=b.max;if(am!==bm)return am-bm;return costOf(a,G.L[a.id])-costOf(b,G.L[b.id])}).forEach(u=>{
    const d=document.createElement("article");d.className="tk";
    const h=document.createElement("h3");h.textContent=u.name;const s=document.createElement("span");s.textContent=u.jp;h.appendChild(s);
    const p=document.createElement("p");
    const pips=document.createElement("div");pips.className="pips";
    if(u.max>1)for(let i=0;i<u.max;i++)pips.appendChild(document.createElement("i"));
    const b=document.createElement("button");b.type="button";b.id="buy-"+u.id;
    b.onclick=()=>buy(u);
    d.append(h,p,pips,b);el.appendChild(d);
    rowsEl[u.id]={d,p,pips,b};
  });
  updateUI();
}
function buy(u){
  const l=G.L[u.id];
  if(l>=u.max||u.req&&!u.req(G.L))return;
  const co=costOf(u,l);
  if(G.money<co)return;
  G.money-=co;G.L[u.id]=l+1;
  groundDirty=true;
  floats.push({x:u.at[0],y:u.at[1],z:2.4,txt:u.name,life:2.8});
  blip();
  renderList();saveCloud();
  if(Object.values(G.L).reduce((a,b)=>a+b,0)===MAXSUM)toast("Hotovo: stanice Komorebi je kompletní. Sedni si a dívej se na vlaky.",7000);
}
function blip(){note(587.33,0,.5,.05,"triangle");note(880,.09,.7,.04,"triangle")}
function hintText(r){
  if(G.L.tracks===0&&G.total<300)return "Stanice vydělává sama. Kupuj, co se ti líbí, nebo se jen dívej.";
  if(r.capRate<r.demand*.9){
    if(G.L.cars<UPGMAP.cars.max)return "Na peronu čeká víc lidí, než vlaky stačí odvézt. Pomohou delší soupravy nebo hustší jízdní řád.";
    return "Na peronu čeká víc lidí, než vlaky stačí odvézt. Pomůže další kolej nebo častější vlaky.";
  }
  if(r.demand<r.capRate*.5)return "Vlaky jezdí poloprázdné. Víc cestujících přivedou nové domy a obchody v okolí.";
  return "Vlaky i cestující jsou v rovnováze. Vyber si, co se ti líbí.";
}
function updateUI(){
  const r=rates(G.L),m=G.money;
  $("money").textContent=yen(m);
  const flowNow=Math.min(r.demand*(eventNow>=0?EVENT_BOOST:1),r.capRate);
  $("rate").textContent="≈ "+yen(flowNow*(r.fare+r.spend)*60)+" za minutu";
  const sum=Object.values(G.L).reduce((a,b)=>a+b,0);
  let rank=RANKS[0][1];for(const [n,t] of RANKS)if(sum>=n&&t)rank=t;
  $("rank").textContent=rank+" · "+sum+" z "+MAXSUM+" vylepšení";
  const hh=Math.floor(hour),mm=Math.floor((hour%1)*60);
  $("clock").textContent=seasonName+" · "+hh+":"+String(mm).padStart(2,"0");
  $("waitChip").textContent="Na peronu "+Math.floor(G.waiting);
  const ec=$("eventChip");
  ec.hidden=eventNow<0;
  if(eventNow>=0){const e=EVENTS[eventNow],t=e.jp+" "+e.name+" · +30 % lidí";if(ec.textContent!==t)ec.textContent=t}
  $("totals").textContent="Přepraveno "+nf.format(Math.floor(G.pax))+" lidí";
  $("hint").textContent=hintText(r);
  let total=0;const per=[0,0,0];
  UPG.forEach(u=>{const l=G.L[u.id];if(l<u.max&&(!u.req||u.req(G.L))&&m>=costOf(u,l)){per[u.tab]++;total++}});
  TABS.forEach((_,i)=>{const d=document.querySelector("#tab"+i+" .dot");if(d)d.textContent=per[i]||""});
  $("openCount").textContent=total?" "+total:"";
  for(const id in rowsEl){
    const u=UPGMAP[id],e=rowsEl[id],l=G.L[id],max=l>=u.max;
    e.d.classList.toggle("maxed",max);
    const lock=u.req&&!u.req(G.L);
    const txt=lock?u.reqText:u.desc;
    if(e.p.textContent!==txt)e.p.textContent=txt;
    [...e.pips.children].forEach((x,i)=>x.classList.toggle("on",i<l));
    const label=max?"Hotovo":lock?"Zamčeno":yen(costOf(u,l));
    if(e.b.textContent!==label)e.b.textContent=label;
    e.b.disabled=max||lock||m<costOf(u,l);
  }
}

/* ovládání kamery a klepnutí */
const pts=new Map();let dragDist=0,pinch=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);dragDist=0;pinch=0});
cv.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId))return;
  const old=pts.get(e.pointerId),dx=e.offsetX-old[0],dy=e.offsetY-old[1];
  pts.set(e.pointerId,[e.offsetX,e.offsetY]);
  if(pts.size===1){cam.x+=dx;cam.y+=dy;dragDist+=Math.abs(dx)+Math.abs(dy);clampCam()}
  else if(pts.size===2){
    const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch)zoomBy(d/pinch);
    pinch=d;dragDist+=10;
  }
});
function endPtr(e){
  if(pts.has(e.pointerId)&&pts.size===1&&dragDist<8)tap(e.offsetX,e.offsetY);
  pts.delete(e.pointerId);if(pts.size<2)pinch=0;
}
cv.addEventListener("pointerup",endPtr);cv.addEventListener("pointercancel",e=>pts.delete(e.pointerId));
cv.addEventListener("wheel",e=>{e.preventDefault();zoomBy(Math.exp(-e.deltaY*.0012))},{passive:false});
function zoomBy(f){cam.userS=Math.max(1,Math.min(3.2,cam.userS*f));clampCam()}
function clampCam(){const lim=(cam.userS-1)*Math.max(W,H)*.55+70;cam.x=Math.max(-lim,Math.min(lim,cam.x));cam.y=Math.max(-lim,Math.min(lim,cam.y))}
function tap(sx,sy){
  const X=(sx-view.ox)/view.s,Y=(sy-view.oy)/view.s;
  for(const a of autos){
    if(a.m!=="hayate"||a.claimed||a.y<.9||a.y>MAPY-.9)continue;
    if(Math.hypot(X-px(a.lane,a.y),Y-py(a.lane,a.y,.5))<Math.max(34,24/view.s)){
      a.claimed=true;
      const gain=Math.max(2500,Math.round(rates(G.L).perMin*.75));
      G.money+=gain;G.total+=gain;
      floats.push({x:a.lane,y:a.y,z:1.8,txt:"+"+yen(gain),life:2.6,big:true});
      toast("Řidič sporťáku Hayate nechal na stanici spropitné "+yen(gain)+".");
      blip();return;
    }
  }
  if(G.L.cafe){
    const hit=cafeCats.find(k=>Math.hypot(X-px(k.x,k.y),Y-(py(k.x,k.y)-4))<Math.max(13,14/view.s));
    if(hit){floats.push({x:hit.x,y:hit.y,z:.7,txt:"♥",life:1.5});meow();return}
  }
  if(!cat)return;
  const cx=px(cat.x,cat.y),cy=py(cat.x,cat.y,cat.z)-14;
  if(Math.hypot(X-cx,Y-cy)<Math.max(26,20/view.s)){
    const r=rates(G.L),gain=Math.max(1000,Math.round(r.perMin*(G.L.cafe?.75:.5)));
    G.money+=gain;G.total+=gain;
    floats.push({x:cat.x,y:cat.y,z:cat.z+1.5,txt:"+"+yen(gain),life:2.6,big:true});
    toast("Kočka štěstí maneki-neko ti přinesla "+yen(gain)+".");
    blip();cat=null;
  }
}
$("closePanel").onclick=()=>{$("panel").classList.add("closed");$("panel").setAttribute("aria-hidden","true");$("openPanel").hidden=false};
$("openPanel").onclick=()=>{$("panel").classList.remove("closed");$("panel").removeAttribute("aria-hidden");$("openPanel").hidden=true};
$("zoomIn").onclick=()=>zoomBy(1.3);$("zoomOut").onclick=()=>zoomBy(1/1.3);
$("soundBtn").onclick=()=>{
  soundOn=!soundOn;
  if(soundOn&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==="suspended")AC.resume();
  $("soundBtn").textContent=soundOn?"Vypnout zvuk":"Zapnout zvuk";
  if(soundOn)melody();
};
function seedStart(){ // první lidé už čekají na peronu
  for(let i=0;i<5;i++){const p=newPerson(9+Math.random()*16,11.3+Math.random()*.8,.5);p.plat="A";p.state="wait";people.push(p)}
}
function resetGame(){
  G={L:blankL(),money:600,total:0,pax:0,clock:.3,savedAt:Date.now(),waiting:5};
  fw=[];people=[];riders=[];floats=[];bits=[];steam=[];cafeCats=[];cat=null;catIn=45;visAcc=0;riderIn=2;
  zebraBusy={};zebraBusyT=0;zebraCool=0;
  bus.phase="off";bus.idle=7;bus.x=44;bus.v=0;bus.did=false;bus.yieldT=0;busCross=false;
  sportOut=false;sportIn=50+Math.random()*30;
  kazeIn=200+Math.random()*100;hoshiIn=240+Math.random()*120;
  autos.forEach(a=>{if(a.m==="hayate")pickCar(a);a.commit=false});
  trains.forEach((t,i)=>{t.phase="wait";t.t=0;t.x=-30;t.sp=null;t.dir=i%2?-1:1;t.wait=i===0?2.5:6+i*5.5});
  seedStart();
  groundDirty=true;tab=0;buildTabs();renderList();saveCloud();
  toast("Hra začíná znovu od první zastávky.",3500);
}
function wireReset(){
  const w=$("resetWrap");
  w.innerHTML='<button id="resetBtn" class="resetMain" type="button">Reset hry</button>';
  $("resetBtn").onclick=()=>{
    w.innerHTML='<span class="resetAsk">Smazat všechna vylepšení a peníze?</span> <button id="resetYes" class="danger" type="button">Ano, resetovat</button> <button id="resetNo" type="button">Zrušit</button>';
    $("resetNo").onclick=wireReset;
    $("resetNo").focus();
    $("resetYes").onclick=()=>{resetGame();wireReset()};
  };
}
addEventListener("pagehide",writeLocal);
document.addEventListener("visibilitychange",()=>{if(document.hidden)saveCloud()});

/* ─────────────── START ─────────────── */
function start(data){
  const hotSave=data&&data.save;
  const local=readLocal();
  const s=hotSave||local;
  if(s)applySave(s);
  if(!s){
    seedStart();
    toast("Vítej v Komorebi. První vlak už přijíždí.",4000);
  }
  resize();updatePalette();uiReady=true;buildTabs();renderList();wireReset();
  new ResizeObserver(()=>resize()).observe(document.body);
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{groundDirty=true});
}
start({});
})();
